<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>RM Record · Ryan Members</title>
  <script src="https://accounts.google.com/gsi/client?hl=ko" async defer></script>
  <style>
    :root{--bg:#f4f4f1;--panel:#fff;--ink:#151515;--muted:#74746e;--line:#deded8;--danger:#a22d25;--ok:#245e3d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 8px 32px rgba(0,0,0,.04)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted)}h1{font-size:31px;margin:5px 0 10px;letter-spacing:-.04em}p{margin:0 0 22px}.muted{color:var(--muted)}label span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 7px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;outline:none;font:inherit}input:focus{border-color:#888}.primary{width:100%;border:0;border-radius:12px;background:#111;color:#fff;padding:13px 16px;font-weight:800;font:inherit;cursor:pointer;margin-top:12px}.primary:disabled{opacity:.45;cursor:wait}.error,.notice,.success{padding:11px 12px;border-radius:11px;font-size:13px;margin:12px 0}.error{background:#fff0ee;color:var(--danger);border:1px solid #f1c7c2}.notice{background:#f0f0ec;color:#555;border:1px solid var(--line)}.success{background:#edf6f0;color:var(--ok);border:1px solid #c3dccb}.hidden{display:none!important}.google-wrap{display:grid;place-items:center;min-height:44px;margin:16px 0 8px}.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}details{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}.foot{margin-top:17px;font-size:11px;color:var(--muted)}.setup-link{display:inline-block;margin-top:10px;font-size:12px;color:#555}.google-copy{text-align:center;font-size:13px;color:var(--muted);margin:0 0 8px}
  </style>
</head>
<body>
  <main class="center">
    <section class="card">
      <div class="eyebrow">RYAN MEMBERS · INTERNAL</div>
      <h1>RM RECORD</h1>
      <p class="muted">허용된 Google 계정으로 로그인합니다. 로그인 상태는 30일 동안 유지됩니다.</p>
      <div id="loading" class="notice">기존 로그인 상태를 확인하고 있습니다…</div>

      <div id="authBox" class="hidden">
        <div id="googleSection" class="hidden">
          <div class="google-copy">Ryan Members 계정으로 계속</div>
          <div id="googleButton" class="google-wrap"></div>
          <div id="googleMessage"></div>
        </div>

        <div id="googleSetupNotice" class="hidden notice">
          Google 로그인 코드는 준비되어 있습니다. 관리자 설정에서 Web Client ID를 한 번 등록하면 활성화됩니다.
          <br><a class="setup-link" href="/rm-record/google-setup/">Google 로그인 설정 열기</a>
        </div>

        <div class="divider">관리자</div>
        <details id="fallbackDetails">
          <summary>내부 접근키로 비상접속</summary>
          <form id="keyForm">
            <label style="margin-top:14px"><span>내부 접근키</span><input id="accessKey" type="password" autocomplete="current-password" /></label>
            <div id="keyMessage"></div>
            <button id="keyLoginBtn" class="primary" type="submit">관리자 접속</button>
          </form>
        </details>
        <div class="foot">Google 로그인은 이메일 신원 확인에만 사용합니다. Gmail·Drive·Calendar 데이터 권한은 요청하지 않습니다.</div>
      </div>
    </section>
  </main>
<script>
(() => {
  const API={
    health:'/api/rm-record-health',
    keyLogin:'/api/rm-record-login',
    googleConfig:'/api/rm-record-google-config',
    googleLogin:'/api/rm-record-google-login'
  };
  const marker='rm_record_access_key';
  const $=id=>document.getElementById(id);
  const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const message=(id,text,type='error')=>$(id).innerHTML=text?`<div class="${type}">${esc(text)}</div>`:'';
  const enter=()=>{
    sessionStorage.setItem(marker,'cookie-session');
    location.replace('/rm-record.html');
  };
  async function json(url,options={}){
    const res=await fetch(url,{credentials:'same-origin',...options});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){const e=new Error(data.error||`요청 실패 (${res.status})`);e.status=res.status;throw e;}
    return data;
  }
  async function waitForGoogle(){
    for(let i=0;i<60;i++){
      if(window.google?.accounts?.id)return true;
      await new Promise(r=>setTimeout(r,100));
    }
    return false;
  }
  async function handleGoogleCredential(response){
    message('googleMessage','Google 계정을 확인하고 있습니다…','notice');
    try{
      await json(API.googleLogin,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:response.credential})});
      enter();
    }catch(err){
      message('googleMessage',err.message||'Google 로그인에 실패했습니다.','error');
    }
  }
  async function renderGoogle(clientId){
    const ready=await waitForGoogle();
    if(!ready){
      message('googleMessage','Google 로그인 모듈을 불러오지 못했습니다. 페이지를 새로고침해 주세요.','error');
      return;
    }
    $('googleSection').classList.remove('hidden');
    google.accounts.id.initialize({
      client_id:clientId,
      callback:handleGoogleCredential,
      auto_select:false,
      cancel_on_tap_outside:true
    });
    google.accounts.id.renderButton($('googleButton'),{
      type:'standard',theme:'outline',size:'large',text:'signin_with',shape:'rectangular',logo_alignment:'left',width:320,locale:'ko'
    });
  }
  $('keyForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const key=$('accessKey').value.trim();
    if(!key)return;
    $('keyLoginBtn').disabled=true;
    message('keyMessage','로그인 중…','notice');
    try{
      await json(API.keyLogin,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessKey:key})});
      $('accessKey').value='';
      enter();
    }catch(err){
      $('keyLoginBtn').disabled=false;
      message('keyMessage',err.status===401?'접근키가 올바르지 않습니다.':err.message,'error');
    }
  });
  (async()=>{
    sessionStorage.removeItem(marker);
    try{await json(API.health,{method:'GET'});return enter();}catch{}
    $('loading').classList.add('hidden');
    $('authBox').classList.remove('hidden');
    try{
      const config=await json(API.googleConfig,{method:'GET'});
      if(config.enabled&&config.clientId)await renderGoogle(config.clientId);
      else $('googleSetupNotice').classList.remove('hidden');
    }catch{
      $('googleSetupNotice').classList.remove('hidden');
    }
  })();
})();
</script>
</body>
</html>
